# Bumped from 2048m: adding the embedded WatermelonDS core (its own Hilt/KSP annotation
# processing plus R8 now covering 8 embedded emulator cores' merged classes) exhausted the old
# heap ("JVM garbage collector is thrashing", daemon killed itself during minifyFullDebugWithR8).
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# GameShelf integration: the embedded PrimeHack library pulls in an old pre-AndroidX transitive
# dependency (com.nononsenseapps:filepicker, which bundles com.android.support:support-media-
# compat) that collides with AndroidX's own androidx.media:media at merge time unless Jetifier
# rewrites it — PrimeHack's own gradle.properties already has this set for the same reason.
android.enableJetifier=true
# RomRunner integration: the embedded WatermelonDS library needs a JDK 21 toolchain (its own
# README states this explicitly) — its :app module's compileOptions/kotlin jvmTarget are both set
# to VERSION_21, but neither uses an explicit `jvmToolchain{}` call, so Gradle doesn't auto-select
# a matching JDK on its own; without this, javac fails with "invalid source release: 21" whenever
# the daemon launches under an older JDK. Pointing the whole build's Gradle daemon at a real JDK
# 21 already provisioned on this machine (Gradle auto-downloaded it earlier for some other
# module's own toolchain request) fixes this project-wide — a newer JDK can always compile down to
# an older --release target, so this doesn't affect any other module that only needs 17.
org.gradle.java.home=/Users/ry/.gradle/jdks/eclipse_adoptium-21-aarch64-os_x.2/jdk-21.0.7+6/Contents/Home
