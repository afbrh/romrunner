# RomRunner integration: RetroArch ships with no gamepad binding at all for opening its own
# quick-menu or quitting (input_menu_toggle_gamepad_combo/input_quit_gamepad_combo both default to
# "0"/none, keyboard-only otherwise) — same class of bug as Cemu's own empty hotkeySettings map.
# Binds Start+Select (unlikely to be pressed by accident mid-game) to reach the quick menu, and
# makes closing content actually exit back to RomRunner instead of dropping into RetroArch's own
# (unstyled, out of scope for this pass) top-level game browser.
input_menu_toggle_gamepad_combo = "4"
quit_on_close_content = "true"
menu_show_quit_retroarch = "true"
confirm_quit = "false"
